services:
  postgres_db:
    image: postgres:16-alpine
    container_name: devpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devpilot_db
    ports:
      - "5332:5432"   # <--- Changed port on host to 5332
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: